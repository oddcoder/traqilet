name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the run in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt does not resolve the dependency graph, so this one job needs neither the
  # cranelift checkout nor a build.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo build --workspace --locked
      - run: cargo build --manifest-path xtask/Cargo.toml --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo test --workspace --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings

  # `advisories` is left out on purpose: it reads a database that changes without us,
  # so it belongs on a schedule rather than on a pull request that cannot have caused it.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources

  # The notice is committed and `include_str!`d, so a stale one ships. Regenerate and
  # insist nothing moved.
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Regenerate
        run: |
          cargo about generate about.hbs \
            | fold -s -w 100 \
            | sed 's/[[:space:]]*$//' >THIRD-PARTY.txt
      - name: THIRD-PARTY.txt is current
        run: |
          git diff --exit-code --stat THIRD-PARTY.txt || {
            echo "::error file=THIRD-PARTY.txt::stale; regenerate it, see its own header"
            exit 1
          }
