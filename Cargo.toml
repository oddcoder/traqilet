[workspace]
members = ["crates/*"]
# the cranelift checkout is its own workspace, not ours
exclude = [".patched"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"

[workspace.dependencies]
ariadne = "0.6"
aya = "0.14"
clap = "4.6"
cranelift-codegen = { path = ".patched/wasmtime/cranelift/codegen" }
cranelift-codegen-meta = { path = ".patched/wasmtime/cranelift/codegen/meta" }
cranelift-isle = { path = ".patched/wasmtime/cranelift/isle/isle" }
env_logger = "0.11"
log = "0.4"
logos = "0.16"
# Must match the version cranelift-codegen resolves, since `PReg` crosses the
# ISLE-generated `Context` trait boundary.
regalloc2 = "0.15.2"
traqilet-bpf = { path = "crates/bpf" }
traqilet-btf = { path = "crates/btf" }
traqilet-lang = { path = "crates/lang" }
traqilet-parser = { path = "crates/parser" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
