[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
ariadne = "0.6"
aya = "0.14"
clap = "4.6"
env_logger = "0.11"
log = "0.4"
logos = "0.16"
traqilet-lang = { path = "crates/lang" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
