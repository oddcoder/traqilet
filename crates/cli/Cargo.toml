[package]
name = "traqilet"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
ariadne = "0.6"
aya = "0.14"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
logos = "0.16"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
